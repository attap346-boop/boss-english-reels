---
name: Boss English reel

on:
  workflow_dispatch:
    inputs:
      date:
        description: optional test date
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack reel code
        run: |
          cat make_boss_reel.part*.gz | gunzip > make_boss_reel.py
          gunzip -c gen.diff.gz > gen.diff
          patch -p0 make_boss_reel.py < gen.diff
          gunzip -c shadow.diff.gz > shadow.diff
          patch -p0 make_boss_reel.py < shadow.diff
          gunzip -c shadow_reel.py.gz > shadow_reel.py
          for f in content_new*.json.gz; do gunzip -c "$f" > "${f%.gz}"; done
          sed -i 's/types = \["structure", "mistake", "shadow", "translate"/types = ["structure", "shadow", "mistake", "translate"/' make_boss_reel.py
          grep -n 'types = ' make_boss_reel.py
          python3 -m py_compile make_boss_reel.py shadow_reel.py
          gunzip -c content.json.gz > content.json

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-freefont-ttf
          pip install --quiet pillow edge-tts gTTS

      - name: Get royalty-free music (CC0)
        run: |
          D=$(date +%j)
          if [ $((10#$D % 2)) -eq 0 ]; then
            URL="https://opengameart.org/sites/default/files/yoiyami_core_theme_0.wav"
          else
            URL="https://opengameart.org/sites/default/files/the_budding_of_consciousness.wav"
          fi
          curl -fL -A "Mozilla/5.0" --retry 3 -o audio.wav "$URL" || ffmpeg -y -loglevel error -f lavfi -i "sine=f=220:d=60" -f lavfi -i "sine=f=261.63:d=60" -f lavfi -i "sine=f=329.63:d=60" -filter_complex "amix=inputs=3,volume=0.25,tremolo=f=0.2:d=0.4" audio.wav

      - name: Build reel
        run: python3 make_boss_reel.py --audio audio.wav ${{ github.event.inputs.date != '' && format('--date {0}', github.event.inputs.date) || '' }}

      - name: Keep only the last 30 reels
        run: |
          ls reels/*.mp4 | head -n -30 | xargs -r rm
          ls reels/*.json | head -n -30 | xargs -r rm

      - name: Commit
        run: |
          git config user.email "reel-bot@users.noreply.github.com"
          git config user.name "reel-bot"
          git add reels
          git diff --cached --quiet || git commit -m "Reel $(date -u +%F)"
          git push
